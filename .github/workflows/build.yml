# Builds the installers on GitHub's machines (decision 155): the .deb and the
# AppImage on Ubuntu, the setup .exe on Windows. Tauri builds only the packages
# of the system it runs on, so each needs its own machine.
#
# Run it from the Actions tab (Build installers → Run workflow) and download the
# files from the run's Artifacts. Pushing a tag such as v0.3.1 also makes a
# draft GitHub release with the files, to check before publishing.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not the newest: packages built against an older system run on newer ones too.
          - name: linux
            os: ubuntu-22.04
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            files: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The same list as README.md, "Build for Linux", plus patchelf for the AppImage.
      - name: Install Linux build packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Once is enough: the unit tests do not depend on the system.
      - name: Unit tests
        if: matrix.name == 'linux'
        run: npm test

      # Also runs scripts/check-about.mjs, which stops on a placeholder left in about.config.ts.
      - name: Build
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ai-novel-generator-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.exe
